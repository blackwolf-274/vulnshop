<!DOCTYPE html>
<html>
<head>
  <title>VulnShop — Practice Lab</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    nav { background: #222; color: #fff; padding: 12px 24px; }
    nav a { color: #7fd4ff; margin-right: 16px; text-decoration: none; }
    .container { max-width: 900px; margin: 24px auto; background: #fff;
                 padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #fff; }
    .vuln { background: #c0392b; } .safe { background: #27ae60; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    input[type=text], input[type=password] { padding: 8px; width: 60%; }
    button { padding: 8px 16px; background: #2c3e50; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    pre { background: #222; color: #ff8; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <nav>
    <b>VulnShop</b> —
    <a href="/">Search (vulnerable)</a>
    <a href="/safe-search/">Search (safe)</a>
    <a href="/login/">Login (vulnerable)</a>
    <a href="/profile/">Profile</a>
  </nav>
  <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
